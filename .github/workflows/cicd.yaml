name: Library API - End to End CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: discover-eks
  IMAGE_NAME: library-api

jobs:
  compile:
    name: Compile
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          mvn -v

      - name: Compile with Maven
        run: mvn -B -ntp compile

  security-scan:
    name: Security scan (secrets and dependencies)
    runs-on: self-hosted
    needs: compile
    steps:
      - name: Checkout code (full history for secret scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Verify security tools are installed
        run: |
          set -e
          gitleaks version
          trivy --version

      - name: Download Maven dependencies
        run: mvn -B -ntp dependency:resolve

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --redact --verbose --report-format json --report-path gitleaks-report.json

      - name: Trivy filesystem scan (report only)
        run: |
          trivy fs --format json --output trivy-fs-report.json .
          trivy fs --severity HIGH,CRITICAL --exit-code 0 .

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            trivy-fs-report.json
          if-no-files-found: ignore

  test:
    name: Unit tests and coverage
    runs-on: self-hosted
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: mvn -B -ntp test

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

  quality-and-package:
    name: Package, SonarQube analysis and quality gate
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Package the application
        run: mvn -B -ntp package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

      - name: SonarQube analysis and quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=library-api \
            -Dsonar.projectName="Library API" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true
  docker-build-scan-push:
    name: Docker build, scan and push to Docker Hub
    runs-on: self-hosted
    needs: quality-and-package
    env:
        IMAGE: ${{ vars.DOCKER_HUB_USERNAME }}/library-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/
   

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Trivy image scan
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"

      - name: Push to Docker Hub
        run: |
          docker push --all-tags "$IMAGE"
          
      - name: Deploy to EKS
        run: |
          sed -e "s|__IMAGE__|$IMAGE_NAME:$IMAGE_TAG|" \
              -e "s|__VERSION__|v$IMAGE_TAG|" \
              k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/eks-demo-app --timeout=180s

      - name: Show deployment status
        run: |
          kubectl get deploy,pods,svc -o wide
