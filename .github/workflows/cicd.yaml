name: Library API - End to End CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: discover-eks
  IMAGE_NAME: library-api

jobs:
  compile:
    name: Compile
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          mvn -v

      - name: Compile with Maven
        run: mvn -B -ntp compile

  security-scan:
    name: Security scan (secrets and dependencies)
    runs-on: self-hosted
    needs: compile
    steps:
      - name: Checkout code (full history for secret scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Install security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sSfL https://raw.githubusercontent.com/zricethezav/gitleaks/master/install.sh | bash
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          gitleaks version
          trivy --version

      - name: Download Maven dependencies
        run: mvn -B -ntp dependency:resolve

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --redact --verbose --report-format json --report-path gitleaks-report.json

      - name: Trivy filesystem scan (report only)
        run: |
          trivy fs --format json --output trivy-fs-report.json .
          trivy fs --severity HIGH,CRITICAL --exit-code 0 .

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            trivy-fs-report.json
          if-no-files-found: ignore